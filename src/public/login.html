<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ClubEvents</title>
    <link rel="stylesheet" href="/css/site.css">
</head>
<body>
    <div class="login-card">
        <h1>Login</h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" autocomplete="current-password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <p id="loginMessage" class="message" role="status" aria-live="polite"></p>
        <section aria-labelledby="signupHeading">
            <h2 id="signupHeading">Create an account</h2>
            <form id="signupForm">
                <div class="form-group">
                    <label for="signupEmail">Email</label>
                    <input type="email" id="signupEmail" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" autocomplete="new-password" required>
                </div>
                <button type="submit">Sign up</button>
            </form>
            <p id="signupMessage" class="message" role="status" aria-live="polite"></p>
        </section>
    </div>
    <script src="/js/login.js"></script>
</body>
</html>
