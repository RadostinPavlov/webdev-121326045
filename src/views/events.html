<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClubEvents - Events</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .event-card { border: 1px solid #ccc; padding: 1rem; margin-bottom: 1rem; border-radius: 4px; }
        .event-title { font-size: 1.25rem; font-weight: bold; }
        .event-details { color: #666; margin-top: 0.5rem; }
        button { cursor: pointer; padding: 0.5rem 1rem; }
        .feedback { font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>Upcoming Events</h1>
        <button id="logoutBtn">Sign Out</button>
    </header>

    <div id="eventsList">
        <p>Loading events...</p>
    </div>

    <script src="/js/events-view.js"></script>
    <script src="/js/events.js"></script>
</body>
</html>
